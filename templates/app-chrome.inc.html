<style id="app-chrome-style">
  .chrome {
    position: sticky;
    top: 0;
    z-index: 40;
    width: 100%;
    flex-shrink: 0;
    background: var(--chrome-bg, rgba(255, 255, 255, .94));
    backdrop-filter: saturate(1.1) blur(10px);
    -webkit-backdrop-filter: saturate(1.1) blur(10px);
    border-bottom: 1px solid var(--line, #e7e5e4);
  }
  .chrome-inner {
    max-width: var(--content-max, 1080px);
    margin: 0 auto;
    padding: 0 20px;
    min-height: 52px;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 16px 24px;
    flex-wrap: wrap;
  }
  .chrome-brand {
    min-width: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 0;
  }
  .chrome h1 {
    margin: 0;
    font-size: 16px;
    font-weight: 650;
    letter-spacing: -.02em;
    line-height: 1.3;
    color: var(--ink, #1c1917);
  }
  .chrome .meta {
    color: var(--muted, #78716c);
    font-size: 12px;
    margin-top: 2px;
    line-height: 1.4;
  }
  .chrome .meta:empty { display: none; }
  .tabs {
    display: flex;
    gap: 0;
    flex-wrap: wrap;
    margin: 0;
    padding: 0;
    align-items: stretch;
  }
  .tabs a {
    border: 0;
    background: transparent;
    border-radius: 0;
    border-bottom: 2px solid transparent;
    padding: 0 14px;
    min-height: 52px;
    display: inline-flex;
    align-items: center;
    color: var(--muted, #78716c);
    cursor: pointer;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    text-decoration: none;
    line-height: 1.2;
  }
  .tabs a:hover {
    color: var(--ink, #1c1917);
    background: transparent;
    text-decoration: none;
  }
  .tabs a.active {
    background: transparent;
    color: var(--ink, #1c1917);
    font-weight: 600;
    border-bottom-color: var(--accent, #1e3a5f);
  }
  html.embedded #app-chrome { display: none !important; }
  </style>
<header class="chrome" id="app-chrome">
  <div class="chrome-inner">
    <div class="chrome-brand">
      <h1>考试助手</h1>
      <div class="meta" id="chrome-meta"></div>
    </div>
    <nav class="tabs" id="tabs" aria-label="主导航">
      <a href="/#latest" data-tab="latest" class="{{ACTIVE_latest}}">最近一次试卷</a>
      <a href="/#papers" data-tab="papers" class="{{ACTIVE_papers}}">历史试卷</a>
      <a href="/#map" data-tab="map" class="{{ACTIVE_map}}">学习地图</a>
    </nav>
  </div>
</header>
