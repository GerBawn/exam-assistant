<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>考试助手</title>
  <style>
    :root {
      --bg: #f5f5f4;
      --paper: #ffffff;
      --ink: #1c1917;
      --muted: #78716c;
      --line: #e7e5e4;
      --accent: #1e3a5f;
      --accent-soft: #eef2f7;
      --ok: #166534;
      --ok-soft: #ecfdf3;
      --bad: #b91c1c;
      --bad-soft: #fef2f2;
      --mid: #a16207;
      --mid-soft: #fefce8;
      --idle: #78716c;
      --idle-soft: #f4f4f5;
      --shadow: none;
      --radius: 8px;
      --content-max: 1080px;
      --chrome-bg: rgba(255, 255, 255, .94);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body {
      font: 15px/1.6 "PingFang SC", "Hiragino Sans GB", "Noto Sans SC", "Source Han Sans SC", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .app {
      max-width: var(--content-max);
      margin: 0 auto;
      padding: 18px 20px 48px;
    }
    h1 { margin: 0 0 6px; font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
    h2 { margin: 0 0 10px; font-size: 15px; font-weight: 650; letter-spacing: -.01em; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 12px; }
    .panel { display: none; }
    .panel.active { display: block; }
    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .paper-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 12px;
      align-items: center;
    }
        .paper-title { font-weight: 650; letter-spacing: -.01em; }
    .paper-sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
    .paper-status { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
    .status {
      display: inline-block;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 12px;
      font-weight: 500;
    }
    .status.done { background: var(--ok-soft); color: var(--ok); }
    .status.open { background: var(--mid-soft); color: var(--mid); }
    .empty { color: var(--muted); margin: 0; }
    .legend { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; align-items: center; }
    .legend .label { font-size: 12px; color: var(--muted); margin-right: 4px; }
    .tag { border-radius: 999px; padding: 3px 9px; font-size: 12px; font-weight: 500; }
    .tag .count { font-weight: 650; margin-left: 4px; }
    .lv-未练 { background: var(--idle-soft); color: var(--idle); }
    .lv-薄弱 { background: var(--bad-soft); color: var(--bad); }
    .lv-学习中 { background: var(--mid-soft); color: var(--mid); }
    .lv-掌握 { background: var(--ok-soft); color: var(--ok); }
    .score {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
        .stat {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .stat .n { font-size: 22px; font-weight: 650; letter-spacing: -.02em; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 2px; }
    .stat.good .n { color: var(--ok); }
    .stat.bad .n { color: var(--bad); }
    .stat.mid .n { color: var(--mid); }
    .overview {
      display: grid;
      grid-template-columns: 280px 1fr;
      gap: 10px;
      margin-bottom: 10px;
      align-items: stretch;
    }
    @media (max-width: 860px) {
      .overview { grid-template-columns: 1fr; }
    }
    .radar-wrap { display: flex; justify-content: center; }
    .radar-wrap svg { width: 100%; max-width: 280px; height: auto; }
    .table-wrap { overflow-x: auto; }
    table.cat { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.cat th, table.cat td {
      padding: 9px 8px;
      text-align: right;
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
    }
    table.cat th:first-child, table.cat td:first-child, table.cat td.left {
      text-align: left;
      white-space: normal;
    }
    table.cat th { color: var(--muted); font-weight: 600; font-size: 12px; }
    table.cat tbody tr:hover td { background: rgba(28, 25, 23, .02); }
    .mod-h { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; margin-bottom: 8px; }
    .mod-h h2 { margin: 0; }
    .mod-h .sub { color: var(--muted); font-size: 13px; }
    body.exam-on { overflow: hidden; display: flex; flex-direction: column; }
    body.exam-on .app {
      flex: 1;
      min-height: 0;
      max-width: none;
      width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
    }
    body.exam-on #panel-latest.active {
      display: flex;
      flex: 1;
      min-height: 0;
    }
    #panel-latest:not(.active) .exam-frame { display: none; }
    body.exam-on .exam-frame {
      flex: 1;
      width: 100%;
      height: 100%;
      border: 0;
      border-radius: 0;
      background: var(--bg);
      position: relative;
      z-index: 1;
    }
  </style>
</head>
<body>
  {{APP_CHROME}}
  <div class="app">
    <section class="panel active" id="panel-latest"></section>
    <section class="panel" id="panel-papers"></section>
    <section class="panel" id="panel-map"></section>
  </div>
  <script>
    const TABS = ["latest", "papers", "map"];
    const LEVELS = ["未练", "薄弱", "学习中", "掌握"];

    function $(id) { return document.getElementById(id); }
    function escapeHtml(text) {
      return String(text || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function fmtTime(iso) {
      if (!iso) return "—";
      const d = new Date(iso);
      if (Number.isNaN(d.getTime())) return iso;
      return d.toLocaleString("zh-CN", { hour12: false, timeZone: "Asia/Shanghai" });
    }
    function pageHref(page) {
      if (!page) return "";
      if (/^https?:\/\//i.test(page)) return page;
      if (page.startsWith("/practice/")) return page;
      return page.startsWith("/pages/") ? page : "/pages/" + page.replace(/^pages\//, "");
    }
    function embedHref(href) {
      if (!href) return "";
      try {
        const u = new URL(href, location.origin);
        u.searchParams.set("embed", "1");
        return u.pathname + u.search + u.hash;
      } catch {
        return href + (href.includes("?") ? "&" : "?") + "embed=1";
      }
    }
    function modeLabel(mode) {
      if (mode === "new" || mode === "material") return "新知练习";
      if (mode === "wrong" || mode === "review") return "错题复习";
      if (mode === "due") return "定期复习";
      if (mode === "mixed" || mode === "history" || mode === "practice") return "综合练习";
      if (mode === "scoped") return "指定范围";
      return "";
    }
    function accText(row) {
      if (!row.submitted) return "";
      if (row.accuracy == null) return "";
      return Math.round(row.accuracy * 100) + "% · 对 " + (row.correct || 0);
    }
    function pct(value) {
      if (value == null || Number.isNaN(Number(value))) return "—";
      return Math.round(Number(value) * 100) + "%";
    }
    function subjectScore(subject) {
      const lv = subject.byLevel || {};
      const total = LEVELS.reduce((sum, name) => sum + (lv[name] || 0), 0);
      if (!total) return 0;
      return ((lv["薄弱"] || 0) * 0.25 + (lv["学习中"] || 0) * 0.6 + (lv["掌握"] || 0) * 1) / total;
    }
    function showTab(name, opts) {
      const tab = TABS.includes(name) ? name : "latest";
      document.querySelectorAll(".tabs [data-tab]").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
      $("panel-latest").classList.toggle("active", tab === "latest");
      $("panel-papers").classList.toggle("active", tab === "papers");
      $("panel-map").classList.toggle("active", tab === "map");
      document.body.classList.toggle("exam-on", tab === "latest" && !!document.querySelector("#panel-latest .exam-frame"));
      if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
      if (tab === "map" && (!opts || opts.refresh !== false)) loadMap();
    }
    function paperCard(row, withOpen) {
      const href = pageHref(row.page);
      const status = row.submitted
        ? `<span class="status done">已交卷</span>`
        : `<span class="status open">未交卷</span>`;
      const acc = accText(row);
      const statusLine = acc
        ? `${status}<span>· ${escapeHtml(acc)}</span>`
        : status;
      const open = withOpen && href
        ? `<a href="${escapeHtml(href)}" data-open-exam>打开试卷</a>`
        : "";
      return `<div class="card">
        <div class="paper-row">
          <div>
            <div class="paper-title">${escapeHtml(row.title || "未命名试卷")}</div>
            <div class="paper-sub">${escapeHtml([row.source, modeLabel(row.mode), (row.questionCount || 0) + " 题", fmtTime(row.submittedAt || row.createdAt)].filter(Boolean).join(" · "))}</div>
          </div>
          <div class="paper-status">${statusLine}</div>
          <div>${open}</div>
        </div>
      </div>`;
    }
    function renderLatest(home) {
      const latest = home.latest || (home.papers || [])[0];
      const panel = $("panel-latest");
      if (!latest) {
        document.body.classList.remove("exam-on");
        panel.innerHTML = `<div class="card"><p class="empty">还没有试卷。出题后会出现在这里。</p></div>`;
        return;
      }
      const href = pageHref(latest.page);
      if (href) {
        panel.innerHTML = `<iframe class="exam-frame" title="最近一次试卷" src="${escapeHtml(embedHref(href))}"></iframe>`;
        document.body.classList.add("exam-on");
      } else {
        document.body.classList.remove("exam-on");
        panel.innerHTML = paperCard(latest, false) + `<p class="empty">这套题还没有练习页文件。</p>`;
      }
    }
    function renderPapers(home) {
      const papers = home.papers || [];
      if (!papers.length) {
        $("panel-papers").innerHTML = `<div class="card"><p class="empty">还没有历史试卷。</p></div>`;
        return;
      }
      $("panel-papers").innerHTML = papers.map(row => paperCard(row, true)).join("");
    }
    function radarHtml(subjects) {
      const named = (subjects || []).filter((s) => s && s.name !== "未分科目");
      if (named.length < 2 || named.length > 8) return "";
      const n = named.length;
      const cx = 140, cy = 140, r = 88;
      function polar(radius, i) {
        const a = -Math.PI / 2 + (i * 2 * Math.PI / n);
        return [cx + radius * Math.cos(a), cy + radius * Math.sin(a)];
      }
      const rings = [0.25, 0.5, 0.75, 1].map((g) => {
        const pts = named.map((_, i) => polar(r * g, i).join(",")).join(" ");
        return `<polygon points="${pts}" fill="none" stroke="#e7e5e4" stroke-width="1"></polygon>`;
      }).join("");
      const axes = named.map((_, i) => {
        const [x, y] = polar(r, i);
        return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e7e5e4" stroke-width="1"></line>`;
      }).join("");
      const dataPts = named.map((s, i) => polar(r * subjectScore(s), i).join(",")).join(" ");
      const labels = named.map((s, i) => {
        const [x, y] = polar(r + 18, i);
        return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" font-size="11" fill="#1c1917">${escapeHtml(s.name)}</text>`;
      }).join("");
      return `<div class="overview">
        <section class="card">
          <h2>科目掌握</h2>
          <p class="meta" style="margin-top:-6px;">越靠外掌握越多；中心是未练。</p>
          <div class="radar-wrap">
            <svg viewBox="0 0 280 280" role="img" aria-label="科目掌握雷达">
              ${rings}${axes}
              <polygon points="${dataPts}" fill="rgba(30,58,95,.16)" stroke="#1e3a5f" stroke-width="2"></polygon>
              ${labels}
            </svg>
          </div>
        </section>
        <section class="card">
          <h2>科目一览</h2>
          <div class="table-wrap">
            <table class="cat">
              <thead><tr><th>科目</th><th>知识点</th><th>作答</th><th>对</th><th>错</th><th>正确率</th><th>待复习</th><th>到期</th></tr></thead>
              <tbody>
                ${named.concat((subjects || []).filter((s) => s.name === "未分科目")).map((s) =>
                  `<tr>
                    <td class="left">${escapeHtml(s.name)}</td>
                    <td>${s.topicCount || 0}</td>
                    <td>${s.attempts || 0}</td>
                    <td>${s.correct || 0}</td>
                    <td>${s.wrong || 0}</td>
                    <td>${pct(s.accuracy)}</td>
                    <td>${s.pendingWrong || 0}</td>
                    <td>${s.dueCount || 0}</td>
                  </tr>`
                ).join("")}
              </tbody>
            </table>
          </div>
        </section>
      </div>`;
    }
    function topicTable(topics) {
      return `<div class="table-wrap"><table class="cat">
        <thead><tr><th>知识点</th><th>作答</th><th>对</th><th>错</th><th>正确率</th><th>待复习</th><th>到期</th><th>掌握</th></tr></thead>
        <tbody>
          ${(topics || []).map((t) => `
            <tr>
              <td class="left">${escapeHtml(t.topic || t.id || "未命名知识点")}</td>
              <td>${t.attempts || 0}</td>
              <td>${t.correct || 0}</td>
              <td>${t.wrong || 0}</td>
              <td>${pct(t.accuracy)}</td>
              <td>${t.pendingWrong || 0}</td>
              <td>${t.due ? `<span class="status open">到期</span>` : `<span class="status done">未到期</span>`}</td>
              <td><span class="tag lv-${escapeHtml(t.level || "未练")}">${escapeHtml(t.level || "未练")}</span></td>
            </tr>`).join("")}
        </tbody>
      </table></div>`;
    }
    function renderMap(map) {
      const panel = $("panel-map");
      const topics = (map && map.topics) || [];
      const summary = (map && map.summary) || {};
      const byLevel = summary.byLevel || {};
      const subjects = (map && map.subjects) || [];
      if (!topics.length) {
        panel.innerHTML = `<div class="card"><p class="empty">还没有学习档案。提供材料开始练习后，掌握情况会出现在这里。</p></div>`;
        return;
      }
      const legend = `<div class="legend">
        <span class="label">掌握情况</span>
        ${LEVELS.map((lv) => `<span class="tag lv-${lv}">${lv}<span class="count">${byLevel[lv] || 0}</span></span>`).join("")}
      </div>`;
      const stats = [
        ["练习场次", summary.practiceCount || 0, ""],
        ["正确率", pct(summary.accuracy), "good"],
        ["待复习错题", summary.pendingWrongCount || 0, summary.pendingWrongCount ? "bad" : ""],
        ["今日到期", summary.dueCount || 0, summary.dueCount ? "mid" : ""],
      ].map(([label, n, cls]) => `<div class="stat ${cls}"><div class="n">${n}</div><div class="l">${label}</div></div>`).join("");
      const namedSubjects = subjects.filter((s) => s.name !== "未分科目");
      const showGroups = namedSubjects.length >= 1 && subjects.length >= 1 && !(subjects.length === 1 && subjects[0].name === "未分科目");
      const tables = showGroups
        ? subjects.map((s) => `<section class="card">
            <div class="mod-h">
              <h2>${escapeHtml(s.name)}</h2>
              <div class="sub">${s.topicCount || 0} 个知识点 · 作答 ${s.attempts || 0} · 正确率 ${pct(s.accuracy)} · 到期 ${s.dueCount || 0}</div>
            </div>
            ${topicTable(s.topics)}
          </section>`).join("")
        : `<section class="card"><h2>知识点</h2>${topicTable(topics)}</section>`;
      const clusters = (map && map.clusters) || [];
      const clusterCard = clusters.length
        ? `<section class="card">
            <div class="mod-h"><h2>知识类</h2><div class="sub">${clusters.length} 类</div></div>
            <div class="table-wrap"><table class="cat">
              <thead><tr><th>类</th><th>科目</th><th>知识点</th><th>到期</th><th>待复习</th><th>薄弱</th><th>正确率</th></tr></thead>
              <tbody>
                ${clusters.map((c) => `
                  <tr>
                    <td class="left">${escapeHtml(c.name || c.id || "未命名")}${c.summary ? `<div class="paper-sub">${escapeHtml(c.summary)}</div>` : ""}</td>
                    <td class="left">${escapeHtml(c.subject || "")}</td>
                    <td>${c.topicCount || 0}</td>
                    <td>${c.dueCount || 0}</td>
                    <td>${c.pendingWrong || 0}</td>
                    <td>${(c.byLevel && c.byLevel["薄弱"]) || 0}</td>
                    <td>${pct(c.accuracy)}</td>
                  </tr>`).join("")}
              </tbody>
            </table></div>
          </section>`
        : "";
      panel.innerHTML = legend + `<div class="score">${stats}</div>` + radarHtml(subjects) + clusterCard + tables;
    }
    function openExam(href) {
      const panel = $("panel-latest");
      let frame = panel.querySelector(".exam-frame");
      if (!frame) {
        panel.innerHTML = `<iframe class="exam-frame" title="最近一次试卷" src="${embedHref(href)}"></iframe>`;
      } else {
        const next = new URL(embedHref(href), location.origin).href;
        if (frame.src !== next) frame.src = embedHref(href);
      }
      showTab("latest", { refresh: false });
    }
    async function loadMap() {
      try {
        const mapRes = await fetch("/api/map");
        const mapBody = await mapRes.json();
        renderMap(mapBody.map || {});
      } catch (err) {
        $("panel-map").innerHTML = `<div class="card"><p class="empty">读取学习地图失败，请确认本机记录服务已启动。</p></div>`;
      }
    }
    document.getElementById("tabs").addEventListener("click", (e) => {
      const btn = e.target.closest("[data-tab]");
      if (!btn) return;
      e.preventDefault();
      showTab(btn.dataset.tab);
    });
    document.body.addEventListener("click", (e) => {
      const examLink = e.target.closest("[data-open-exam]");
      if (examLink) {
        e.preventDefault();
        openExam(examLink.getAttribute("href"));
      }
    });
    window.addEventListener("hashchange", () => showTab(location.hash.slice(1)));
    if ($("chrome-meta")) $("chrome-meta").textContent = "正在读取记录…";
    async function load() {
      try {
        const homeRes = await fetch("/api/home");
        const homeBody = await homeRes.json();
        const home = homeBody.home || {};
        $("chrome-meta").textContent = "更新于 " + fmtTime(home.updatedAt) + " · 试卷 " + (home.papers || []).length + " 套";
        renderLatest(home);
        renderPapers(home);
        const start = new URLSearchParams(location.search).get("tab") || location.hash.slice(1) || "latest";
        showTab(start);
      } catch (err) {
        $("chrome-meta").textContent = "读取记录失败，请确认本机记录服务已启动。";
      }
    }
    load();
  </script>
</body>
</html>
